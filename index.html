<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Беги, лох</title>
<style>
  html, body { margin: 0; height: 100%; background: #191433; overflow: hidden; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; }
  #ui { position: fixed; left: 0; right: 0; bottom: max(22px, env(safe-area-inset-bottom)); display: none; justify-content: center; gap: 12px; padding: 0 16px; }
  #ui.on { display: flex; }
  button { font: 800 17px/1 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; padding: 15px 22px; border: 0; border-radius: 14px; background: #ffd23f; color: #191433; cursor: pointer; }
  button.ghost { background: rgba(244, 241, 255, .16); color: #f4f1ff; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"><button id="again">Еще раз</button><button id="share" class="ghost">Позор в чат</button></div>
<script>
(() => {
'use strict';

const FINISH = 700;              // m
const PPM = 24;                  // px per meter
const V0 = 250, VMAX = 400;      // world speed, px/s
const G = 2600, J1 = 820, J2 = 680, CUT = 380;
const FF = 'system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';

const qs = new URLSearchParams(location.search);
const clean = s => (s || '').replace(/[\u0000-\u001f\u007f-\u009f]/g, '').replace(/\s+/g, ' ').trim();
let NAME = clean(qs.get('name'));
if ([...NAME].length > 20) NAME = [...NAME].slice(0, 19).join('') + '…';
const ANON = !NAME;
if (ANON) NAME = 'Ты';
const BOT = (qs.get('bot') || '').replace(/\W/g, '');
const GAME = (qs.get('game') || '').replace(/\W/g, '');
const SHOT = qs.get('shot');     // cover | dead | win: static frames for screenshots

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const ui = document.getElementById('ui');
const btnAgain = document.getElementById('again');
const btnShare = document.getElementById('share');
if (!BOT || !GAME) btnShare.remove();

let W = 420, H = 320, GY = 220, RX = 72;
let sky, layers = [], stars = [];

const R = { alt: 0, vy: 0, w: 24, h: 46, ground: true, jumps: 0, rot: 0, phase: 0 };
let state = 'ready', stateT = 0, t = 0, paused = false, uiShown = false;
let dist = 0, speed = V0, obs = [], parts = [], sinceSpawn = 0, nextGap = 0;
let shake = 0, resultM = 0, best = 0, newBest = false;
try { best = +localStorage.getItem('begiloh.best') || 0; } catch (e) {}

const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, k) => a + (b - a) * k;
const meters = () => dist / PPM;

function mulberry(a) {
  return () => {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let x = Math.imul(a ^ a >>> 15, 1 | a);
    x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x;
    return ((x ^ x >>> 14) >>> 0) / 4294967296;
  };
}

function resize() {
  const cw = innerWidth, ch = innerHeight;
  const dpr = Math.min(devicePixelRatio || 1, 2.5);
  const s = Math.min(cw / 420, ch / 320);
  W = cw / s; H = ch / s;
  GY = Math.round(H - Math.max(70, H * 0.3));
  RX = Math.round(Math.min(W * 0.18, 110));
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  ctx.setTransform(s * dpr, 0, 0, s * dpr, 0, 0);
  build();
}

function build() {
  sky = ctx.createLinearGradient(0, 0, 0, GY);
  sky.addColorStop(0, '#191433');
  sky.addColorStop(0.55, '#3b2563');
  sky.addColorStop(0.86, '#a8457a');
  sky.addColorStop(1, '#f07a6a');
  const rnd = mulberry(20261112);
  const hs = Math.max(1, GY / 240);
  stars = Array.from({ length: 46 }, () => [rnd() * 1600, rnd() * GY * 0.6, rnd() * 1.3 + 0.5, rnd() * 6]);
  layers = [
    { k: 0.12, col: '#2c2350', win: 'rgba(255,214,102,.28)', lo: 70, hi: 160 },
    { k: 0.32, col: '#3d2d68', win: 'rgba(255,214,102,.75)', lo: 40, hi: 115 },
  ];
  for (const L of layers) {
    L.items = [];
    let x = 0;
    while (x < 1600) {
      const w = 44 + rnd() * 70 | 0, h = (L.lo + rnd() * (L.hi - L.lo)) * hs | 0, wins = [];
      for (let wy = 10; wy < h - 10; wy += 14)
        for (let wx = 7; wx < w - 9; wx += 12) if (rnd() < 0.3) wins.push(wx, wy);
      L.items.push({ x, w, h, wins });
      x += w + (rnd() * 12 | 0);
    }
    L.len = x;
  }
}

// ---------- state ----------

function reset() {
  dist = 0; speed = V0; obs = []; parts = []; sinceSpawn = 0; nextGap = V0 * 1.6;
  R.alt = 0; R.vy = 0; R.ground = true; R.jumps = 0; R.rot = 0;
  shake = 0; newBest = false;
}

function setState(s) {
  state = s; stateT = 0; uiShown = false;
  ui.classList.remove('on');
}

function start() { reset(); setState('run'); }

function showUI() { uiShown = true; ui.classList.add('on'); }

function die() {
  setState('dead');
  R.vy = 380; R.ground = false;
  shake = 0.3;
  dust(RX + R.w / 2, GY - R.alt - 20, 10);
  resultM = Math.floor(meters());
  if (resultM > best) { best = resultM; newBest = true; save(); }
  if (navigator.vibrate) try { navigator.vibrate(90); } catch (e) {}
}

function win() {
  setState('win');
  resultM = FINISH;
  if (FINISH > best) { best = FINISH; newBest = true; save(); }
  confetti(170);
}

function save() { try { localStorage.setItem('begiloh.best', String(best)); } catch (e) {} }

// ---------- input ----------

function press() {
  if (paused) { paused = false; return; }
  if (state === 'ready') { start(); return; }
  if (state !== 'run') return;
  if (R.ground) { R.vy = J1; R.ground = false; R.jumps = 1; dust(RX + R.w / 2, GY, 5); }
  else if (R.jumps < 2) { R.vy = J2; R.jumps = 2; }
}

function release() {
  if (state === 'run' && !R.ground && R.vy > CUT) R.vy = CUT;
}

cv.addEventListener('pointerdown', e => { e.preventDefault(); press(); });
for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) cv.addEventListener(ev, release);
addEventListener('keydown', e => {
  if (!['Space', 'ArrowUp', 'KeyW', 'Enter'].includes(e.code)) return;
  e.preventDefault();
  if (e.repeat) return;
  if (state === 'dead' || state === 'win') { if (uiShown) start(); return; }
  press();
});
addEventListener('keyup', e => { if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) release(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'run') paused = true; });
addEventListener('resize', resize);

btnAgain.addEventListener('click', start);
if (btnShare.isConnected) btnShare.addEventListener('click', () => {
  const text = state === 'win'
    ? `${NAME} добегает до финиша и все равно лох.`
    : `${NAME} — лох. ${resultM} м из ${FINISH}.`;
  const link = `https://t.me/${BOT}?game=${GAME}`;
  open(`https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent(text)}`, '_blank');
});

// ---------- world ----------

const SIZE = {
  cone: [22, 30], cones2: [50, 30], scooter: [60, 34],
  barrier: [32, 80], puddle: [96, 8], pigeon: [30, 18],
};

function spawn(m) {
  const pool = ['cone', 'cone', 'cone'];
  if (m > 25) pool.push('scooter', 'scooter');
  if (m > 60) pool.push('barrier', 'barrier');
  if (m > 90) pool.push('puddle');
  if (m > 140) pool.push('pigeon', 'pigeon');
  if (m > 220) pool.push('cones2');
  const type = pool[Math.random() * pool.length | 0];
  const [w, h] = SIZE[type];
  const o = { type, x: W + 30, w, h, t: rand(0, 6) };
  obs.push(o);
  return o;
}

function box(o) {
  switch (o.type) {
    case 'cone': return [o.x + 5, GY - o.h + 10, o.w - 10, o.h - 10];
    case 'cones2': return [o.x + 5, GY - 20, o.w - 10, 20];
    case 'scooter': return [o.x + 4, GY - 28, o.w - 8, 28];
    case 'barrier': return [o.x + 4, GY - o.h + 4, o.w - 8, o.h - 4];
    case 'puddle': return [o.x + 16, GY - 3, o.w - 32, 3];
    case 'pigeon': { const cy = GY - 66 + Math.sin(o.t * 5) * 3; return [o.x + 3, cy - 8, 25, 13]; }
  }
}

const runnerBox = () => [RX + 5, GY - R.alt - R.h + 6, R.w - 10, R.h - 8];
const hit = (a, b) => a[0] < b[0] + b[2] && a[0] + a[2] > b[0] && a[1] < b[1] + b[3] && a[1] + a[3] > b[1];

function physics(dt) {
  if (!R.ground) {
    R.vy -= G * dt; R.alt += R.vy * dt;
    if (R.alt <= 0) {
      R.alt = 0; R.vy = 0; R.ground = true; R.jumps = 0;
      if (state === 'run') dust(RX + R.w / 2, GY, 4);
    }
  }
  R.phase += dt * Math.max(speed, 120) / 17;
}

function moveObs(dt) {
  for (const o of obs) { o.t += dt; o.x -= (speed + (o.type === 'pigeon' ? 70 : 0)) * dt; }
  obs = obs.filter(o => o.x + o.w > -40);
}

function update(dt) {
  t += dt; stateT += dt;
  if (state === 'ready') {
    dist += 60 * dt; R.phase += dt * 9;
  } else if (state === 'run') {
    const m = meters();
    speed = V0 + (VMAX - V0) * Math.min(1, m / (FINISH * 0.85));
    dist += speed * dt;
    sinceSpawn += speed * dt;
    if (sinceSpawn >= nextGap && FINISH - m > 45) {
      const o = spawn(m);
      const k = Math.min(1, m / FINISH);
      sinceSpawn = 0;
      nextGap = speed * lerp(rand(1.0, 1.8), rand(0.78, 1.3), k) + o.w;
    }
    physics(dt);
    moveObs(dt);
    const rb = runnerBox();
    for (const o of obs) if (hit(rb, box(o))) { die(); break; }
    if (state === 'run' && meters() >= FINISH) win();
  } else if (state === 'dead') {
    speed *= Math.pow(0.02, dt); dist += speed * dt;
    R.vy -= G * dt; R.alt += R.vy * dt;
    if (R.alt <= 0) { R.alt = 0; R.vy = Math.abs(R.vy) > 250 ? Math.abs(R.vy) * 0.25 : 0; }
    R.rot = Math.min(Math.PI / 2, R.rot + dt * 9);
    moveObs(dt);
    if (stateT > 0.75 && !uiShown) showUI();
  } else if (state === 'win') {
    speed *= Math.pow(0.2, dt); dist += speed * dt;
    physics(dt);
    if (speed < 30 && R.ground && stateT > 1) { R.vy = 520; R.ground = false; }
    moveObs(dt);
    if (stateT > 1.2 && !uiShown) showUI();
  }
  for (const p of parts) {
    p.life -= dt;
    p.x += p.vx * dt - (p.k ? 0 : speed * dt);
    p.y += p.vy * dt;
    p.vy += (p.k ? 60 : 300) * dt;
    p.rot += p.vr * dt;
  }
  parts = parts.filter(p => p.life > 0);
  if (shake > 0) shake = Math.max(0, shake - dt);
}

function dust(x, y, n) {
  for (let i = 0; i < n; i++)
    parts.push({ k: 0, x: x + rand(-6, 6), y, vx: rand(-80, 30), vy: rand(-90, -20), life: rand(0.3, 0.55), max: 0.55, r: rand(1.5, 3.5), rot: 0, vr: 0 });
}

function confetti(n) {
  const cols = ['#ffd23f', '#ff5d73', '#19c3b1', '#8fa8ff', '#f4f1ff'];
  for (let i = 0; i < n; i++)
    parts.push({ k: 1, x: rand(0, W), y: rand(-80, -5), vx: rand(-50, 50), vy: rand(30, 120), life: rand(3, 5), max: 5, r: rand(3, 6), rot: rand(0, 6), vr: rand(-8, 8), c: cols[i % cols.length] });
}

// ---------- drawing ----------

function rr(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
}

function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }

function drawLayer(L) {
  const off = (dist * L.k) % L.len;
  for (let base = -off; base < W; base += L.len) {
    for (const b of L.items) {
      const x = base + b.x;
      if (x > W || x + b.w < 0) continue;
      ctx.fillStyle = L.col; ctx.fillRect(x, GY - b.h, b.w, b.h + 1);
      ctx.fillStyle = L.win;
      for (let i = 0; i < b.wins.length; i += 2) ctx.fillRect(x + b.wins[i], GY - b.h + b.wins[i + 1], 5, 6);
    }
  }
}

function drawGround() {
  ctx.fillStyle = '#2a2340'; ctx.fillRect(-20, GY, W + 40, H - GY + 20);
  ctx.fillStyle = '#54476f'; ctx.fillRect(-20, GY, W + 40, 5);
  ctx.fillStyle = 'rgba(255,255,255,.10)';
  const o = dist % 48;
  for (let x = -o; x < W; x += 48) ctx.fillRect(x, GY + 5, 2, 12);
  ctx.fillStyle = 'rgba(255,214,102,.35)';
  const o2 = dist % 90, ly = GY + Math.min(60, (H - GY) * 0.45);
  for (let x = -o2; x < W; x += 90) ctx.fillRect(x, ly, 46, 4);
}

function cone(x, w, h) {
  const top = GY - h, half = y => 2 + (w / 2 - 5) * (y - top) / (h - 3);
  ctx.fillStyle = '#ff7a1a';
  ctx.beginPath();
  ctx.moveTo(x + 3, GY - 3); ctx.lineTo(x + w / 2 - 2, top); ctx.lineTo(x + w / 2 + 2, top); ctx.lineTo(x + w - 3, GY - 3);
  ctx.closePath(); ctx.fill();
  const y1 = GY - h * 0.64, y2 = GY - h * 0.44, c = x + w / 2;
  ctx.fillStyle = '#f4f1ff';
  ctx.beginPath();
  ctx.moveTo(c - half(y1), y1); ctx.lineTo(c + half(y1), y1); ctx.lineTo(c + half(y2), y2); ctx.lineTo(c - half(y2), y2);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#3b3550'; ctx.fillRect(x, GY - 4, w, 4);
}

function scooter(x, w, h) {
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = '#19c3b1'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(x + 8, GY - 9); ctx.lineTo(x + w - 12, GY - 9); ctx.lineTo(x + w - 6, GY - h); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + w - 13, GY - h); ctx.lineTo(x + w + 1, GY - h); ctx.stroke();
  ctx.fillStyle = '#0f8f83'; ctx.fillRect(x + 6, GY - 12, w - 20, 5);
  ctx.fillStyle = '#14121f'; circle(x + 8, GY - 5, 5); circle(x + w - 10, GY - 5, 5);
  ctx.fillStyle = '#8d93ab'; circle(x + 8, GY - 5, 1.6); circle(x + w - 10, GY - 5, 1.6);
}

function barrier(x, w, h) {
  ctx.fillStyle = '#2b2740';
  ctx.fillRect(x + 3, GY - h, 4, h); ctx.fillRect(x + w - 7, GY - h, 4, h);
  ctx.fillRect(x - 2, GY - 4, 14, 4); ctx.fillRect(x + w - 12, GY - 4, 14, 4);
  const py = GY - h + 4, ph = h - 18;
  ctx.save();
  ctx.beginPath(); ctx.rect(x, py, w, ph); ctx.clip();
  ctx.fillStyle = '#f4f1ff'; ctx.fillRect(x, py, w, ph);
  ctx.fillStyle = '#e8364f';
  for (let s = -ph; s < w + ph; s += 14) {
    ctx.beginPath();
    ctx.moveTo(x + s, py); ctx.lineTo(x + s + 7, py); ctx.lineTo(x + s + 7 - ph, py + ph); ctx.lineTo(x + s - ph, py + ph);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function puddle(x, w) {
  ctx.fillStyle = 'rgba(96,140,230,.9)';
  ctx.beginPath(); ctx.ellipse(x + w / 2, GY + 2, w / 2, 5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.45)';
  ctx.beginPath(); ctx.ellipse(x + w * 0.38, GY + 1, w * 0.16, 1.5, 0, 0, Math.PI * 2); ctx.fill();
}

function pigeon(o) {
  const x = o.x, cy = GY - 66 + Math.sin(o.t * 5) * 3, flap = Math.sin(o.t * 16);
  ctx.fillStyle = '#8d93ab';
  ctx.beginPath(); ctx.moveTo(x + 22, cy); ctx.lineTo(x + 31, cy - 3); ctx.lineTo(x + 31, cy + 4); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x + 15, cy, 11, 7, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#6f7590';
  ctx.beginPath(); ctx.moveTo(x + 9, cy - 2); ctx.lineTo(x + 23, cy - 2); ctx.lineTo(x + 19, cy - 2 - flap * 13); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#7b819b'; circle(x + 5, cy - 5, 5);
  ctx.fillStyle = '#58c08f'; ctx.fillRect(x + 6, cy - 1, 5, 3);
  ctx.fillStyle = '#e7b54a';
  ctx.beginPath(); ctx.moveTo(x + 1, cy - 7); ctx.lineTo(x - 4, cy - 4.5); ctx.lineTo(x + 1, cy - 3); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ffeaa0'; ctx.fillRect(x + 3, cy - 7, 2, 2);
}

function drawObs(o) {
  switch (o.type) {
    case 'cone': cone(o.x, o.w, o.h); break;
    case 'cones2': cone(o.x, 22, 30); cone(o.x + 28, 22, 26); break;
    case 'scooter': scooter(o.x, o.w, o.h); break;
    case 'barrier': barrier(o.x, o.w, o.h); break;
    case 'puddle': puddle(o.x, o.w); break;
    case 'pigeon': pigeon(o); break;
  }
}

function drawRunner() {
  const dead = state === 'dead';
  const air = !R.ground && !dead;
  const moving = state === 'ready' || state === 'run' || (state === 'win' && speed > 25);
  const lie = R.rot / (Math.PI / 2);
  ctx.save();
  ctx.translate(RX + R.w / 2, GY - R.alt - 20 + 12 * lie);
  ctx.rotate(R.rot);
  ctx.translate(0, 20);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  let a = 0.15, b = -0.15;
  if (air) { a = 1.0; b = -0.6; } else if (moving) { a = Math.sin(R.phase) * 0.9; b = -a; }
  const leg = (ang, col) => {
    const kx = Math.sin(ang) * 8, ky = -15 + Math.cos(ang) * 8;
    const sh = ang < 0 ? ang * 2.2 : ang * 0.3;
    const fx = kx + Math.sin(sh) * 8, fy = ky + Math.cos(sh) * 8;
    ctx.strokeStyle = col; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(0, -15); ctx.lineTo(kx, ky); ctx.lineTo(fx, fy); ctx.stroke();
    ctx.fillStyle = '#f4f1ff';
    ctx.beginPath(); ctx.ellipse(fx + 2, fy, 4, 2.6, 0, 0, Math.PI * 2); ctx.fill();
  };
  const arm = (ang, col) => {
    ctx.strokeStyle = col; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(0, -29); ctx.lineTo(Math.sin(ang) * 6, -29 + Math.cos(ang) * 6);
    ctx.lineTo(Math.sin(ang + 0.9) * 6 + Math.sin(ang) * 6, -29 + Math.cos(ang) * 6 + Math.cos(ang + 0.9) * 5); ctx.stroke();
  };
  leg(b, '#1f2240');
  arm(a * 0.9, '#c9405a');
  ctx.fillStyle = '#ff5d73'; rr(-8, -34, 16, 20, 6); ctx.fill();
  ctx.fillStyle = '#e04a62'; ctx.fillRect(-5, -22, 10, 3);
  leg(a, '#2b2d55');
  arm(-a * 0.9, '#ff8fa0');
  ctx.fillStyle = '#ffd2b0'; circle(1, -39, 7);
  ctx.fillStyle = '#ffd23f';
  ctx.beginPath(); ctx.arc(1, -40, 7.4, Math.PI, Math.PI * 2); ctx.fill();
  ctx.fillRect(3, -41.5, 8, 2.5);
  if (dead) {
    ctx.strokeStyle = '#191433'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(3, -40); ctx.lineTo(6, -37); ctx.moveTo(6, -40); ctx.lineTo(3, -37); ctx.stroke();
  } else {
    ctx.fillStyle = '#191433'; circle(5, -38, 1.3);
  }
  ctx.restore();
}

function drawFinish() {
  const fx = RX + R.w / 2 + (FINISH * PPM - dist);
  if (fx < -60 || fx > W + 60) return;
  const cs = 6;
  for (let r = 0; r * cs < H - GY; r++)
    for (let c = 0; c < 2; c++) { ctx.fillStyle = (r + c) % 2 ? '#f4f1ff' : '#191433'; ctx.fillRect(fx - cs + c * cs, GY + r * cs, cs, cs); }
  const top = GY - 128;
  ctx.fillStyle = '#d9d4ef'; ctx.fillRect(fx - 46, top, 5, 128); ctx.fillRect(fx + 41, top, 5, 128);
  ctx.fillStyle = '#ff5d73'; rr(fx - 50, top - 4, 100, 26, 6); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = `900 15px ${FF}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('ФИНИШ', fx, top + 9);
}

function drawParts() {
  for (const p of parts) {
    const a = Math.min(1, p.life / (p.k ? 1 : p.max));
    if (p.k) {
      ctx.save(); ctx.globalAlpha = a; ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2);
      ctx.restore();
    } else {
      ctx.fillStyle = `rgba(220,210,255,${0.6 * a})`; circle(p.x, p.y, p.r);
    }
  }
}

function drawHUD() {
  const m = Math.min(FINISH, meters());
  const x = 16, y = 14, w = W - 32;
  ctx.fillStyle = 'rgba(244,241,255,.14)'; rr(x, y, w, 8, 4); ctx.fill();
  ctx.fillStyle = '#ffd23f'; rr(x, y, Math.max(8, w * m / FINISH), 8, 4); ctx.fill();
  ctx.font = `800 15px ${FF}`; ctx.textBaseline = 'top';
  ctx.textAlign = 'left'; ctx.fillStyle = '#f4f1ff'; ctx.fillText(`${m | 0} м`, x, y + 15);
  ctx.textAlign = 'right'; ctx.fillStyle = 'rgba(244,241,255,.6)'; ctx.fillText(`финиш ${FINISH} м`, x + w, y + 15);
}

function fit(text, weight, px, maxW) {
  ctx.font = `${weight} ${px}px ${FF}`;
  const w = ctx.measureText(text).width;
  if (w > maxW) { px *= maxW / w; ctx.font = `${weight} ${px}px ${FF}`; }
  return px;
}

function label(text, x, y, px, color, weight = 900, stroke = true) {
  px = fit(text, weight, px, W - 32);
  if (stroke) {
    ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(3, px * 0.16); ctx.strokeStyle = '#191433';
    ctx.strokeText(text, x, y);
  }
  ctx.fillStyle = color; ctx.fillText(text, x, y);
  return px;
}

const backOut = k => 1 + 2.7 * Math.pow(k - 1, 3) + 1.7 * Math.pow(k - 1, 2);

function drawOverlay() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const k = Math.max(0.62, Math.min(1.25, GY / 300));
  const cx = W / 2, cy = GY * 0.44;
  const soft = 'rgba(244,241,255,.82)';

  if (state === 'ready') {
    let y = cy - 58 * k;
    label(ANON ? 'БЕГИ, ЛОХ' : `БЕГИ, ${NAME.toUpperCase()}`, cx, y, 44 * k, '#ffd23f');
    y += 48 * k;
    label('Тап — прыжок, держи дольше — выше', cx, y, 16 * k, soft, 700, false); y += 22 * k;
    label('Тап в воздухе — второй прыжок', cx, y, 16 * k, soft, 700, false); y += 22 * k;
    label(`Финиш через ${FINISH} м${best ? ` · рекорд ${best} м` : ''}`, cx, y, 16 * k, soft, 700, false); y += 38 * k;
    if (SHOT || Math.sin(t * 5) > -0.4) label('Тапни, чтобы начать', cx, y, 19 * k, '#ffd23f', 900);
  }

  if (state === 'cover') {
    label('БЕГИ, ЛОХ', cx, cy - 18 * k, 64 * k, '#ffd23f');
    label('бег с препятствиями. финал известен', cx, cy + 34 * k, 17 * k, soft, 700, false);
  }

  if ((state === 'dead' || state === 'win') && stateT > 0.3) {
    const fade = Math.min(1, (stateT - 0.3) / 0.3);
    ctx.fillStyle = `rgba(15,10,32,${0.5 * fade})`; ctx.fillRect(0, 0, W, H);
    const win = state === 'win';
    const verdict = win ? 'ВСЕ РАВНО ЛОХ' : 'ЛОХ';
    const namePx = 30 * k, statPx = 16 * k;
    const verPx = fit(verdict, 900, (win ? 72 : 124) * k, W - 32);
    const total = namePx + 10 * k + verPx * 0.8 + 16 * k + statPx * 2.4;
    let y = cy - total / 2 + namePx / 2;
    label(`${NAME} —`, cx, y, namePx, '#f4f1ff', 800);
    y += namePx / 2 + 10 * k + verPx * 0.4;
    const pop = backOut(Math.min(1, (stateT - 0.3) / 0.35)) * (1 + 0.035 * Math.sin(stateT * 7));
    ctx.save(); ctx.translate(cx, y); ctx.scale(pop, pop);
    label(verdict, 0, 0, verPx, '#ffd23f');
    ctx.restore();
    y += verPx * 0.4 + 16 * k + statPx / 2;
    const s1 = win ? `Финиш, ${FINISH} м. Не помогло.` : `${resultM} м из ${FINISH}`;
    const s2 = newBest ? 'новый рекорд, но это ничего не меняет' : `рекорд ${best} м`;
    label(s1, cx, y, statPx * 1.1, '#f4f1ff', 800, false);
    label(s2, cx, y + statPx * 1.4, statPx, soft, 700, false);
  }

  if (paused) {
    ctx.fillStyle = 'rgba(15,10,32,.55)'; ctx.fillRect(0, 0, W, H);
    label('ПАУЗА', cx, cy, 48 * k, '#ffd23f');
    label('Тапни, чтобы продолжить', cx, cy + 40 * k, 17 * k, soft, 700, false);
  }
}

function draw() {
  ctx.fillStyle = '#191433'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  if (shake > 0) { const a = shake * 22; ctx.translate(rand(-a, a), rand(-a, a)); }
  ctx.fillStyle = sky; ctx.fillRect(-20, -20, W + 40, GY + 20);
  for (const s of stars) {
    ctx.fillStyle = `rgba(244,241,255,${0.35 + 0.3 * Math.sin(t * 2 + s[3])})`;
    ctx.fillRect(s[0] % W, s[1], s[2], s[2]);
  }
  ctx.fillStyle = 'rgba(255,236,190,.92)'; circle(W * 0.8, GY * 0.2, 16);
  ctx.fillStyle = 'rgba(255,236,190,.12)'; circle(W * 0.8, GY * 0.2, 28);
  drawLayer(layers[0]); drawLayer(layers[1]);
  drawGround();
  drawFinish();
  for (const o of obs) drawObs(o);
  drawRunner();
  drawParts();
  ctx.restore();
  if (state === 'run' || ((state === 'dead' || state === 'win') && stateT < 0.3)) drawHUD();
  drawOverlay();
}

// ---------- boot ----------

resize();
reset();

if (SHOT === 'cover') {
  state = 'cover'; dist = 160 * PPM; R.alt = 58; R.ground = false; R.phase = 1;
  const add = (type, x) => { const [w, h] = SIZE[type]; obs.push({ type, x, w, h, t: 1.2 }); };
  add('cone', RX - 2); add('pigeon', RX + 240); add('barrier', RX + 390);
} else if (SHOT === 'dead') {
  state = 'dead'; stateT = 2; dist = 342 * PPM; resultM = 342; best = Math.max(best, 512); R.rot = Math.PI / 2; speed = 0;
  const [w, h] = SIZE.scooter; obs.push({ type: 'scooter', x: RX + 18, w, h, t: 0 });
  showUI();
} else if (SHOT === 'win') {
  state = 'win'; stateT = 2; dist = FINISH * PPM + 90; resultM = FINISH; newBest = true; speed = 0;
  confetti(170); for (const p of parts) p.y = rand(0, GY);
  showUI();
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000);
  last = now;
  if (!paused && !SHOT) update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
